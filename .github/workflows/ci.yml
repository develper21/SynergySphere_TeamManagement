name: CI - Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend and server dependencies
        run: npm ci

      - name: Lint frontend and server
        run: npm run lint

      - name: Test server
        run: npm run test:server

      - name: Test frontend
        run: npm run test:frontend

      - name: Build frontend
        run: npm run build